<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANLOGA DISTRICT RHEMA FULL GOSPEL CHURCHES — Monthly Report</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ====================== LOGIN SCREEN ====================== -->
<div id="loginScreen" class="login-screen">
  <div class="login-header">
    <img src="logo.jpg" alt="RFGC Logo" class="login-logo">
    <h1>ANLOGA DISTRICT RHEMA FULL GOSPEL CHURCHES</h1>
    <h2>MONTHLY REPORT</h2>
  </div>
  <div class="login-card">
    <div class="role-tabs" id="roleTabs">
      <button class="role-tab active" data-role="secretary">Secretary</button>
      <button class="role-tab" data-role="pastor">Pastor</button>
      <button class="role-tab" data-role="admin">Admin</button>
    </div>
    <div class="login-form">
      <label>Username
        <input type="text" id="loginUsername" autocomplete="username" placeholder="Enter username">
      </label>
      <label>Password
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Enter password">
      </label>
      <div id="loginError" class="login-error"></div>
      <button id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
      <p class="login-hint" id="loginHint"></p>
    </div>
  </div>
  <div class="login-footer">
    <p>Developed by: <strong>V. C. Gbetodeme</strong></p>
    <p>Contact: <strong>0243302919</strong></p>
  </div>
</div>

<!-- ====================== APP SHELL ====================== -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-left">
      <img src="logo.jpg" alt="logo" class="mini-logo">
      <div>
        <div class="topbar-title">ANLOGA DISTRICT RHEMA FULL GOSPEL CHURCHES</div>
        <div class="topbar-sub">Monthly Report System</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="user-chip" id="userChip"></span>
      <button class="btn btn-ghost" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="main-layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- signature pad modal -->
<div id="signModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="signModalTitle">Draw Signature</h3><button class="modal-x" id="signModalClose">×</button></div>
    <div class="sign-tabs">
      <button class="sign-tab active" data-mode="draw">Draw</button>
      <button class="sign-tab" data-mode="upload">Upload</button>
    </div>
    <div class="sign-area">
      <canvas id="signCanvas" width="560" height="200"></canvas>
      <div class="sign-upload hidden" id="signUploadArea">
        <input type="file" id="signFile" accept="image/*">
        <img id="signPreview" alt="preview">
      </div>
    </div>
    <div class="sign-actions">
      <button class="btn btn-ghost" id="signClear">Clear</button>
      <button class="btn btn-primary" id="signSave">Use Signature</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
